<title>100 Day Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first single column; sticky top bar, bottom tab bar, a persistent dashboard hero above each day's journal. */
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --surface2:#E3E8F3; --ink:#0E1526; --muted:#566077; --line:#D6DCEA;
  --accent:#2B4FD8; --accent-ink:#FFFFFF; --accent-soft:#E0E7FF;
  --c2:#0E8F7C; --c3:#C27A00;
  --good:#1E8E4E; --ok:#D9A300; --bad:#C8453D; --none:#C9D0E0;
  --shadow:0 1px 2px rgba(14,21,38,.06),0 6px 20px rgba(14,21,38,.05);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1C; --surface:#121A2B; --surface2:#1B2640; --ink:#E7ECF8; --muted:#8E9AB5; --line:#25314A;
    --accent:#8AA4FF; --accent-ink:#0A1230; --accent-soft:#1B2552;
    --c2:#3FD1B0; --c3:#E5A33A;
    --good:#4CC67E; --ok:#E0B23C; --bad:#EC6B63; --none:#33405C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F1C; --surface:#121A2B; --surface2:#1B2640; --ink:#E7ECF8; --muted:#8E9AB5; --line:#25314A;
  --accent:#8AA4FF; --accent-ink:#0A1230; --accent-soft:#1B2552;
  --c2:#3FD1B0; --c3:#E5A33A;
  --good:#4CC67E; --ok:#E0B23C; --bad:#EC6B63; --none:#33405C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,select,textarea,label{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-appearance:none;appearance:none}
input:not([type=checkbox]):not([type=file]),textarea,select{font-size:16px;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:44px}
select{background-image:none}
body{overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1.5px solid transparent;border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card>header,.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 8px;margin-inline:-16px;padding-inline:16px}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent)}
.top-r{display:flex;align-items:center;gap:10px}
.sync{font-size:.74rem;color:var(--muted)}
.ibtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:.85rem;font-weight:600}
.ibtn:hover{background:var(--surface2)}

/* hero */
.hero{display:flex;flex-direction:column;gap:16px;background:var(--surface)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bigday{font-family:var(--display);font-weight:800;font-size:clamp(3rem,16vw,4.6rem);line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bigday .of{font-size:.38em;color:var(--muted);font-weight:600;letter-spacing:0}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-family:var(--display);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1}
.track{position:relative;height:44px}
.track .bar{position:absolute;left:0;right:0;top:12px;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.track .fill{height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.track .tick{position:absolute;top:8px;width:2px;height:20px;background:var(--bg);transform:translateX(-1px);border-radius:2px}
.track .tl{position:absolute;top:30px;font-size:.68rem;color:var(--muted);transform:translateX(-50%);font-family:var(--mono)}
.track .tl.l{transform:none;left:0}.track .tl.r{transform:none;right:0}
.track .pin{position:absolute;top:3px;width:4px;height:30px;border-radius:3px;background:var(--ink);transform:translateX(-2px);transition:left .6s cubic-bezier(.2,.8,.2,1)}
.stat{background:var(--surface2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.55em;color:var(--muted);font-weight:600;margin-left:2px}
.stat input{background:transparent;border:0;padding:0;font-family:var(--display);font-weight:700;font-size:1.45rem;width:100%;border-bottom:2px dashed var(--line);border-radius:0}
.stat input:focus{border-bottom-color:var(--accent);outline:none}
.stat.accent{background:var(--accent-soft)}
.neg{color:var(--bad)}

/* day nav */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .mid{text-align:center;min-width:0}
.daynav .t{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.nbtn{background:var(--surface);border:1px solid var(--line);width:44px;height:44px;border-radius:14px;font-size:1.1rem;flex:none}
.nbtn:disabled{opacity:.35;cursor:default}
.chip{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.quote{font-family:var(--display);font-weight:500;font-size:1.1rem;line-height:1.35;text-wrap:balance}

/* progress bars */
.pb{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pb>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease;width:0}
.pb>i.p{background:var(--c2)}
.pb>i.over{background:var(--c3)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kv .big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.note.warn{background:color-mix(in srgb,var(--c3) 16%,var(--surface));color:var(--ink)}

/* meals */
.meal{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.meal:first-of-type{border-top:0;padding-top:0}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.food{display:grid;grid-template-columns:minmax(0,1fr) 5.5rem 40px;gap:6px;background:var(--surface2);border-radius:14px;padding:8px}
.food input{background:var(--surface)}
.food .mac{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.food .mac label{display:flex;flex-direction:column;gap:2px;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.food .mac input{padding:7px 6px}
.xbtn{background:var(--surface);border:0;border-radius:10px;color:var(--bad);font-size:1.2rem;line-height:1}
.add{background:var(--accent-soft);color:var(--accent);border:0;border-radius:12px;padding:8px 12px;font-weight:700;font-size:.85rem}
.add:hover{filter:brightness(.97)}
.pri{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:700}
.sec{background:var(--surface2);border:0;border-radius:12px;padding:10px 14px;font-weight:600}
.danger{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad);border:0;border-radius:12px;padding:10px 14px;font-weight:700}

/* workout */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--surface2);border:0;border-radius:12px;padding:9px 16px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.ex{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:6px;background:var(--surface2);border-radius:14px;padding:8px}
.ex input{background:var(--surface)}
.ex .mac{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ex .mac label{display:flex;flex-direction:column;gap:2px;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* habits */
.habit{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--surface2);cursor:pointer;user-select:none}
.habit input{position:absolute;opacity:0;width:0;height:0}
.habit .bx{width:26px;height:26px;border-radius:9px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;transition:all .18s}
.habit .bx svg{width:16px;height:16px;stroke:var(--accent-ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:all .18s}
.habit input:checked+.bx{background:var(--accent);border-color:var(--accent)}
.habit input:checked+.bx svg{opacity:1;transform:none}
.habit input:focus-visible+.bx{outline:2px solid var(--accent);outline-offset:2px}
.habit .tx{flex:1;min-width:0;font-weight:500}
.habit .au{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* calendar */
.cal{display:grid;grid-template-columns:2rem repeat(7,minmax(0,1fr));gap:6px;align-items:center}
.cal .wl{font-size:.68rem;color:var(--muted);font-family:var(--mono)}
.cal button{aspect-ratio:1;border:0;border-radius:12px;font-family:var(--mono);font-size:.82rem;font-weight:500;color:var(--ink);position:relative;background:var(--none);max-width:100%}
.cal button.good{background:var(--good);color:#fff}
.cal button.ok{background:var(--ok);color:#1a1300}
.cal button.poor{background:var(--bad);color:#fff}
.cal button.none{background:var(--surface2);color:var(--muted)}
.cal button.future{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.cal button.today{outline:3px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.ms{display:flex;flex-wrap:wrap;gap:8px}
.ms button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 13px;font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:6px}
.ms button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ms button:disabled{opacity:.55;cursor:default}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.76rem;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-120%);z-index:3;font-family:var(--mono)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:6px}
.lg i{display:inline-block;width:18px;height:0;border-top:3px solid var(--c);margin-right:6px;vertical-align:3px}
.lg i.d{border-top-style:dashed}
.rng{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px}
.rng button{background:transparent;border:0;border-radius:9px;padding:6px 12px;font-weight:600;font-size:.82rem}
.rng button[aria-pressed=true]{background:var(--surface);box-shadow:var(--shadow)}

/* weekly */
details.wk{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
details.wk>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.wk>summary::-webkit-details-marker{display:none}
details.wk .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:760px}
.tabs button{background:transparent;border:0;border-radius:12px;padding:8px 2px;font-size:.72rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected=true]{color:var(--accent);background:var(--accent-soft)}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,12,24,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:22px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);max-height:88%;overflow:auto}
.dlg textarea{min-height:140px;font-family:var(--mono);font-size:.78rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.celebrate{text-align:center;position:relative;overflow:hidden;align-items:center}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.celebrate .big{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;letter-spacing:-.03em;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;display:flex;align-items:center;gap:12px;z-index:60;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{background:transparent;border:0;color:var(--accent);font-weight:700;padding:0}
:root[data-theme="light"] .toast button{color:#8AA4FF}
.view{display:flex;flex-direction:column;gap:14px;min-width:0}
.ph{width:100%;max-height:260px;object-fit:cover;border-radius:14px;background:var(--surface2)}
.meal-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.add.photo{background:var(--surface2);color:var(--ink)}
.slot{aspect-ratio:3/4;max-width:100%;border:2px dashed var(--line);background:var(--surface2);border-radius:14px;display:grid;place-items:center;color:var(--muted);font-weight:600;overflow:hidden;padding:0;width:100%}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.has{border-style:solid;border-color:transparent}
.fullph{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:var(--surface2)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--surface2);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><i></i>100 Day Journal</div>
    <div class="top-r"><span class="sync" id="sync"></span><button class="ibtn" id="themeBtn" type="button">Theme</button></div>
  </div>

  <section id="v-today" class="view">
    <div class="card hero" id="hero"></div>
    <div class="view" id="journal"></div>
  </section>
  <section id="v-cal" class="view" hidden></section>
  <section id="v-prog" class="view" hidden></section>
  <section id="v-wk" class="view" hidden></section>
  <section id="v-data" class="view" hidden></section>
</div>

<datalist id="foods"></datalist>
<input type="file" id="photoIn" accept="image/jpeg,image/png,image/webp" hidden>
<input type="file" id="bodyPhotoIn" accept="image/*" hidden>
<div id="overlay"></div>
<div id="toastHost"></div>

<nav class="tabs" aria-label="Sections"><div class="in" role="tablist">
  <button type="button" role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 20V10l8-6 8 6v10z"/><path d="M9 20v-6h6v6"/></svg>Journal</button>
  <button type="button" role="tab" data-tab="cal" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Calendar</button>
  <button type="button" role="tab" data-tab="prog" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 15l4-4 3 3 5-6"/></svg>Progress</button>
  <button type="button" role="tab" data-tab="wk" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Weekly</button>
  <button type="button" role="tab" data-tab="data" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 00-2-1.2L14.2 3h-4.4l-.4 2.6a7 7 0 00-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2 1.2l.4 2.6h4.4l.4-2.6c.7-.3 1.4-.7 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>Data</button>
</div></nav>

<script>
(function(){
'use strict';
/* ---------- constants & helpers ---------- */
var DAYS=100;
var LS='hundred-day-journal.v1';
var HABITS=[
  ['cal','Hit calorie target','Within 75–102% of target'],
  ['prot','Hit protein target','Protein at or above target'],
  ['work','Completed workout','Workout marked Yes'],
  ['steps','8,000+ steps','Steps 8,000 or more'],
  ['water','Drank enough water','Water at or above target'],
  ['sleep','Slept 7+ hours','Sleep 7 h or more'],
  ['snack','No unnecessary snacking','Your call'],
  ['consistent','Stayed consistent','Your call']
];
var MEALS=[['breakfast','Breakfast'],['lunch','Lunch'],['snacks','Snacks'],['dinner','Dinner']];
var WTYPES=['Strength','Cardio','Walking','Swimming','Sports','Rest day'];
var MET={'Strength':5,'Cardio':7,'Walking':3.5,'Swimming':6,'Sports':6,'Rest day':0};

function hasData(d){if(!d)return false;if(num(d.weight)||num(d.waist)||num(d.bf)||num(d.sleep)||num(d.water)||num(d.steps))return true;
  if(d.meals&&d.meals.length)return true;var w=d.workout;if(w&&(w.done||(w.ex&&w.ex.length)||num(w.duration)))return true;
  for(var k in (d.habits||{}))return true;return !!(d.note&&d.note.trim())}

var dirty={},flushT=null,localT=null,flushing=false;

function docFor(key){
  if(key==='settings')return S.settings;
  if(key.indexOf('day-')===0){var n=+key.slice(4),d=S.days[n];return (d&&hasData(d))?Object.assign({n:n},d):null}
  if(key.indexOf('wk-')===0){var w=+key.slice(3);return S.weeks[w]?Object.assign({w:w},S.weeks[w]):null}
  return null}
function clean(o){return JSON.parse(JSON.stringify(o))}
async function flush(){
  if(!dbh||flushing){return}flushing=true;
  try{
    while(true){var keys=Object.keys(dirty);if(!keys.length)break;
      for(var i=0;i<keys.length;i++){var k=keys[i];delete dirty[k];var data=docFor(k),ref=dbh.doc('data/users/'+uid+'/'+k);
        if(data)await ref.set(clean(data));else await ref.delete()}}
    setSync('synced')
  }catch(e){setSync('error');
    if(e&&e.code==='unavailable'){setTimeout(function(){flushing=false;flush()},4000);return}}
  flushing=false}

function fld(l,k,v,type,step){return '<label class="f"><span class="lbl">'+l+'</span><input data-set="'+k+'" type="'+type+'"'+(step?' step="'+step+'" inputmode="decimal"':'')+' value="'+esc(v)+'"></label>'}
function calSetWarn(){var e=$('setWarn');if(!e)return;var c=S.settings.calTarget;
  e.innerHTML=c<1200?'<div class="note warn">Under 1,200 kcal a day is very low for most adults. Please check this target with a doctor or dietitian.</div>':c<1500?'<div class="note warn">Under 1,500 kcal a day is aggressive for most adults. Make sure it suits you medically.</div>':''}
$('v-data').addEventListener('input',function(e){var t=e.target,k=t.dataset.set;if(!k)return;
  if(k==='startDate'){if(t.value)S.settings.startDate=t.value}
  else{var v=parseFloat(t.value);if(!isNaN(v)&&v>0)S.settings[k]=v}
  mark('settings');calSetWarn();updateHero()});
function csv(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function dailyCSV(){
  var hd=['Day','Date','Weight kg','Waist cm','Body fat %','Sleep h','Water L','Steps','Calorie target','Calories','Protein target g','Protein g','Carbs g','Fat g','Workout done','Workout type','Duration min','Calories burned','Exercises','Habits %'].concat(HABITS.map(function(h){return h[1]})).concat(['Notes']),rows=[hd];
  for(var n=1;n<=DAYS;n++){var d=S.days[n];if(!hasData(d))continue;var t=totals(d),tg=targets(d),hv=habitVals(d),w=d.workout||{};
    rows.push([n,dateOf(n),d.weight,d.waist,d.bf,d.sleep,d.water,d.steps,tg.cal,Math.round(t.cal),tg.prot,r1(t.p),r1(t.c),r1(t.f),w.done||'',w.type||'',w.duration,w.burned,
      (w.ex||[]).map(function(x){return (x.name||'?')+' '+(x.sets||'')+'x'+(x.reps||'')+(num(x.wt)?' @'+x.wt+'kg':'')}).join('; '),Math.round(habitPct(d)*100)].concat(HABITS.map(function(h){return hv[h[0]]?1:0})).concat([d.note||'']))}
  return rows.map(function(r){return r.map(csv).join(',')}).join('\n')}
function mealsCSV(){var rows=[['Day','Date','Meal','Food','Quantity','Calories','Protein g','Carbs g','Fat g']];
  for(var n=1;n<=DAYS;n++){var d=S.days[n];if(!d||!d.meals)continue;d.meals.forEach(function(m){rows.push([n,dateOf(n),m.type,m.name,m.qty,m.cal,m.p,m.c,m.f])})}
  return rows.map(function(r){return r.map(csv).join(',')}).join('\n')}
$('v-data').addEventListener('click',function(e){var b=e.target.closest('[data-x]');if(!b)return;var x=b.dataset.x;
  if(x==='csv')saveFile('100-day-journal-daily.csv',dailyCSV());
  else if(x==='meals')saveFile('100-day-journal-meals.csv',mealsCSV());
  else if(x==='json')saveFile('100-day-journal-backup.json',JSON.stringify({app:'hundred-day-journal',version:1,exported:new Date().toISOString(),settings:S.settings,days:S.days,weeks:S.weeks},null,1));
  else if(x==='import')importDlg();
  else if(x==='reset')confirmDlg('Erase every entry, review and setting? This cannot be undone. Export a backup first if you might want it.','Erase everything',true).then(function(ok){if(ok)resetAll()})});
function importDlg(){
  var el=openDlg('<h3>Import a backup</h3><div class="small muted">Choose a backup file or paste its contents. Importing replaces what is in the journal now.</div><input type="file" id="impFile" accept=".json,application/json"><textarea id="impTxt" placeholder="Paste backup JSON here"></textarea><div class="row"><button class="pri" data-go type="button">Import</button><button class="sec" data-x type="button">Cancel</button></div>');
  el.querySelector('#impFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){el.querySelector('#impTxt').value=r.result};r.readAsText(f)});
  el.addEventListener('click',function(e){
    if(e.target.hasAttribute('data-x')||e.target===el){closeDlg();return}
    if(e.target.hasAttribute('data-go')){var j;try{j=JSON.parse(el.querySelector('#impTxt').value)}catch(x){toast('That is not valid JSON');return}
      if(!j||j.app!=='hundred-day-journal'||!j.settings||!j.days){toast('That file is not a journal backup');return}
      var cnt=Object.keys(j.days).length;
      closeDlg();confirmDlg('Replace your journal with this backup ('+cnt+' logged days)?','Replace',true).then(function(ok){if(ok)importData(j)})}})}
async function importData(j){
  await replaceAll({settings:Object.assign({},DEF,j.settings,{celebrated:j.settings.celebrated||{}}),days:j.days||{},weeks:j.weeks||{}});toast('Backup imported')}
async function resetAll(){
  var s=Object.assign({},DEF,{startDate:ymd(new Date()),celebrated:{},theme:S.settings.theme});await replaceAll({settings:s,days:{},weeks:{}},true);wipePhotos();cur=1;showTab('today');toast('Journal reset')}
async function replaceAll(ns,wipe){
  var old=Object.keys(S.days).map(mKey).concat(Object.keys(S.weeks).map(function(w){return 'wk-'+pad(w)}));
  S.settings=ns.settings;S.days={};S.weeks={};
  Object.keys(ns.days).forEach(function(k){S.days[+k]=ns.days[k]});Object.keys(ns.weeks).forEach(function(k){S.weeks[+k]=ns.weeks[k]});
  old.forEach(function(k){dirty[k]=1});Object.keys(S.days).forEach(function(k){dirty[mKey(+k)]=1});Object.keys(S.weeks).forEach(function(k){dirty['wk-'+pad(k)]=1});dirty.settings=1;
  applyTheme();saveLocal();cur=actDay();
  if(dbh){setSync('saving');flush()}
  checkMilestones(true);redrawVisible()}

/* ---------- tabs ---------- */
function showTab(t){tab=t;
  ['today','cal','prog','wk','data'].forEach(function(k){$('v-'+k).hidden=k!==t});
  document.querySelectorAll('.tabs [data-tab]').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===t))});
  if(t==='today'){renderJournal()}else if(t==='cal')renderCal();else if(t==='prog')renderProgress();else if(t==='wk')renderWeeks();else renderData();
  scrollTo(0,0)}
function redrawVisible(){if(tab==='today'){buildHero();renderJournal()}else showTab(tab)}
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab)});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.settings){var nd=actDay();if(nd!==lastToday){lastToday=nd;if(tab==='today'){cur=nd;renderJournal()}}}});
var lastToday=1;

/* ---------- boot ---------- */
function boot(){
  var loc=loadLocal();
  S.settings=Object.assign({},DEF,loc&&loc.settings||{});if(!S.settings.startDate)S.settings.startDate=ymd(new Date());
  S.days={};S.weeks={};if(loc){Object.keys(loc.days||{}).forEach(function(k){S.days[+k]=loc.days[k]});Object.keys(loc.weeks||{}).forEach(function(k){S.weeks[+k]=loc.weeks[k]})}
  if(!loc)saveLocal();
  S.settings.celebrated=S.settings.celebrated||{};
  applyTheme();setSync('local');buildHero();cur=actDay();lastToday=cur;renderJournal();
  setTimeout(function(){checkMilestones(false)},700);
  connectDb()}
async function connectDb(){
  try{
    if(!(window.claude&&window.claude.use))return;
    var user=await window.claude.use('user'),db=await window.claude.use('db');if(!db||!user)return;
    var id=await user.id();if(!id)return;
    var snap=await db.collection('data/users/'+id).get();
    uid=id;dbh=db;
    if(snap.size>0){
      var ns={settings:null,days:{},weeks:{}};
      snap.docs.forEach(function(d){var v=d.data();if(d.id==='settings')ns.settings=v;else if(d.id.indexOf('day-')===0)ns.days[+d.id.slice(4)]=v;else if(d.id.indexOf('wk-')===0)ns.weeks[+d.id.slice(3)]=v});
      if(ns.settings){S.settings=Object.assign({},DEF,ns.settings);S.days=ns.days;S.weeks=ns.weeks;S.settings.celebrated=S.settings.celebrated||{};applyTheme();cur=actDay();saveLocal();setSync('synced');
        if(!document.activeElement||document.activeElement===document.body)redrawVisible();else{updateHero()}
        return}}
    /* nothing stored yet: upload what this device already has */
    dirty.settings=1;Object.keys(S.days).forEach(function(k){if(hasData(S.days[k]))dirty[mKey(+k)]=1});Object.keys(S.weeks).forEach(function(k){dirty['wk-'+pad(k)]=1});
    setSync('saving');flush()
  }catch(e){dbh=null;setSync('local')}}
boot();
})();
</script>
