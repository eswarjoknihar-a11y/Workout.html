<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Day | Fitness Journal</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171b;--muted:#737983;--line:#e7e9ed;--accent:#111;--good:#1f9d65;--warn:#d68a00;--bad:#d94b4b;--shadow:0 10px 30px rgba(20,24,35,.07)}
[data-theme=dark]{--bg:#0e1013;--card:#171a1f;--text:#f5f6f8;--muted:#9da3ad;--line:#292e36;--accent:#fff;--shadow:0 12px 30px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1320px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.brand h1{margin:0;font-size:27px;letter-spacing:-.7px}.brand p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 13px;border-radius:11px}.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.hero{grid-column:span 2;display:flex;align-items:center;gap:25px}.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--pct),var(--line) 0);flex:none}.ring:before{content:"";width:105px;height:105px;background:var(--card);border-radius:50%;position:absolute}.ring span{position:relative;font-size:22px;font-weight:800}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.09em}.big{font-size:30px;font-weight:800;letter-spacing:-1px}.statrow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.mini{padding:12px;border:1px solid var(--line);border-radius:13px}.muted{color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 14px;border-radius:12px}.tab.active{background:var(--accent);color:var(--bg)}.section{display:none}.section.active{display:block}.two{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px}.field textarea{min-height:76px;resize:vertical}.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0%;border-radius:inherit}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:12px;color:var(--muted)}.meal{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.meal h4{margin:0 0 8px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--bg);font-size:12px}.calendar{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.day{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:10px;display:grid;place-items:center;position:relative}.day small{font-size:10px}.day.good{background:color-mix(in srgb,var(--good) 20%,var(--card));border-color:var(--good)}.day.partial{background:color-mix(in srgb,var(--warn) 18%,var(--card));border-color:var(--warn)}.day.bad{background:color-mix(in srgb,var(--bad) 15%,var(--card));border-color:var(--bad)}.day.selected{outline:2px solid var(--accent);outline-offset:2px}.chart{height:260px;width:100%;display:block}.notice{padding:11px 13px;border-radius:12px;background:var(--bg);color:var(--muted);margin-top:10px}.motivation{font-size:18px;font-weight:700;letter-spacing:-.2px}.danger{color:var(--bad)}.success{color:var(--good)}.footer{color:var(--muted);text-align:center;padding:30px 0 10px;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-column:span 2}.two,.three{grid-template-columns:1fr}.fields{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:13px}.grid{grid-template-columns:1fr}.hero{grid-column:auto;flex-direction:column;align-items:flex-start}.fields{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(5,1fr)}.top{align-items:flex-start;flex-direction:column}.ring{width:115px;height:115px}.ring:before{width:91px;height:91px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY='fitness100-v1';
const today=new Date();
const defaultState={startWeight:100,targetWeight:80,startDate:today.toISOString().slice(0,10),day:1,theme:'light',calorieTarget:2200,proteinTarget:120,days:{}};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||defaultState;
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function d(n){return state.days[n]||(state.days[n]={weight:'',waist:'',bodyfat:'',sleep:'',water:'',calorieTarget:state.calorieTarget,calories:0,proteinTarget:state.proteinTarget,protein:0,carbs:0,fat:0,steps:0,workout:false,workoutType:'Strength',duration:0,burned:0,exercises:[],habits:{cal:false,protein:false,workout:false,steps:false,water:false,sleep:false,snack:false,consistent:false},meals:[],reflection:{good:'',bad:'',next:''}})}
let selected=state.day;
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function val(n,k){return esc(d(n)[k])}
function set(n,k,v){d(n)[k]=v}
function progress(){const weights=Object.values(state.days).map(x=>+x.weight).filter(Boolean);const current=weights.length?weights[weights.length-1]:state.startWeight;return {current,lost:state.startWeight-current,remaining:Math.max(0,current-state.targetWeight),pct:Math.max(0,Math.min(100,(state.startWeight-current)/(state.startWeight-state.targetWeight)*100)),weights}}
function streak(){let s=0;for(let i=selected;i>=1;i--){const x=d(i);const c=Object.values(x.habits).filter(Boolean).length;if(c>=6)s++;else break}return s}
function dayScore(x){return Object.values(x.habits).filter(Boolean).length}
function motivation(){const a=['You don’t need a perfect day. You need another consistent one.','The scale is data, not a verdict.','Stack one useful day on top of another.','Today counts even if today isn’t spectacular.','Make the next meal, walk, and workout easier than the last one.','Consistency is the quiet part that changes the result.'];return a[(selected-1)%a.length]}
function render(){document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light';const p=progress(),x=d(selected),score=dayScore(x);const calLeft=Math.max(0,+x.calorieTarget-(+x.calories||0));const protPct=Math.min(100,(+x.protein||0)/(+x.proteinTarget||1)*100);const calPct=Math.min(100,(+x.calories||0)/(+x.calorieTarget||1)*100);document.getElementById('app').innerHTML=`
<div class="top"><div class="brand"><h1>100 Day <span class="muted">/ Fitness Journal</span></h1><p>100 kg → 80 kg · Day ${selected} of 100</p></div><div class="actions"><button class="btn" onclick="toggleTheme()">${state.theme==='dark'?'☀️ Light':'🌙 Dark'}</button><button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn" onclick="backup()">Backup</button><button class="btn" onclick="document.getElementById('restore').click()">Restore</button><input id="restore" type="file" accept="application/json" hidden onchange="restore(event)"></div></div>
<div class="grid">
<div class="card hero"><div class="ring" style="--pct:${p.pct}%"><span>${p.pct.toFixed(0)}%</span></div><div><div class="eyebrow">Challenge progress</div><div class="big">${p.current.toFixed(1)} kg</div><div class="muted">${p.lost.toFixed(1)} kg lost · ${p.remaining.toFixed(1)} kg to goal</div><div class="statrow"><div class="mini"><div class="eyebrow">Starting</div><b>100 kg</b></div><div class="mini"><div class="eyebrow">Target</div><b>80 kg</b></div></div></div></div>
${stat('Day',selected+'/100')}${stat('Days left',100-selected)}${stat('Streak',streak()+' days')}
</div>
<div class="tabs"><button class="tab active" onclick="tab('journal',this)">Daily Journal</button><button class="tab" onclick="tab('progress',this)">Progress</button><button class="tab" onclick="tab('calendar',this)">Calendar</button><button class="tab" onclick="tab('analytics',this)">Analytics</button></div>
<div id="journal" class="section active">${journal(x,calPct,protPct,calLeft,score)}</div><div id="progress" class="section">${progressView(p)}</div><div id="calendar" class="section">${calendar()}</div><div id="analytics" class="section">${analytics()}</div>
<div class="footer">Your data is stored locally in this browser. Weight loss projections are estimates, not promises.</div>`}
function stat(a,b){return `<div class="card"><div class="eyebrow">${a}</div><div class="big">${b}</div></div>`}
function journal(x,calPct,protPct,calLeft,score){return `<div class="two"><div><div class="card"><div class="row"><div><div class="eyebrow">Daily journal</div><h2 style="margin:3px 0 0">Day ${selected}</h2></div><select onchange="selected=+this.value;render()">${Array.from({length:100},(_,i)=>`<option ${i+1===selected?'selected':''}>${i+1}</option>`).join('')}</select></div><div class="notice motivation">${motivation()}</div><h3>Body</h3><div class="fields">${input('Morning weight (kg)','weight','number',x.weight,'saveField')}${input('Waist (cm)','waist','number',x.waist,'saveField')}${input('Body fat %','bodyfat','number',x.bodyfat,'saveField')}${input('Sleep (hours)','sleep','number',x.sleep,'saveField')}${input('Water (L)','water','number',x.water,'saveField')}${input('Steps','steps','number',x.steps,'saveField')}</div><h3>Nutrition</h3><div class="fields">${input('Calorie target','calorieTarget','number',x.calorieTarget,'saveField')}${input('Calories consumed','calories','number',x.calories,'saveField')}${input('Protein target (g)','proteinTarget','number',x.proteinTarget,'saveField')}${input('Protein (g)','protein','number',x.protein,'saveField')}${input('Carbs (g)','carbs','number',x.carbs,'saveField')}${input('Fat (g)','fat','number',x.fat,'saveField')}</div><div class="mini" style="margin-top:12px"><div class="row"><b>Calories</b><span>${calLeft} kcal remaining</span></div><div class="bar"><i style="width:${calPct}%"></i></div><div class="row" style="margin-top:9px"><b>Protein</b><span>${x.protein}/${x.proteinTarget} g</span></div><div class="bar"><i style="width:${protPct}%"></i></div></div></div>
<div class="card"><div class="row"><div><div class="eyebrow">Workout</div><h3 style="margin:3px 0">Move the needle</h3></div><label class="pill"><input type="checkbox" ${x.workout?'checked':''} onchange="set(${selected},'workout',this.checked);d(${selected}).habits.workout=this.checked;save()"> Completed</label></div><div class="fields">${selectField('Type','workoutType',x.workoutType,['Strength','Cardio','Walking','Swimming','Sports','Rest day'])}${input('Duration (min)','duration','number',x.duration,'saveField')}${input('Est. calories burned','burned','number',x.burned,'saveField')}</div><h4>Exercises</h4><div id="exercises">${x.exercises.map((e,i)=>`<div class="meal"><div class="row"><b>${esc(e.name||'Exercise')}</b><button class="btn" onclick="d(${selected}).exercises.splice(${i},1);save()">Delete</button></div><span class="muted">${e.sets} sets · ${e.reps} reps · ${e.weight||0} kg</span></div>`).join('')||'<span class="muted">No exercises logged yet.</span>'}</div><button class="btn" style="margin-top:10px" onclick="addExercise()">＋ Add exercise</button></div></div>
<div class="card" style="margin-top:14px"><div class="row"><div><div class="eyebrow">Meals</div><h3 style="margin:3px 0">Food log</h3></div><button class="btn primary" onclick="addMeal()">＋ Add Food</button></div>${['Breakfast','Lunch','Snacks','Dinner'].map(meal=>`<div class="meal"><h4>${meal}</h4>${x.meals.filter(m=>m.meal===meal).map((m,i)=>`<div class="row"><span>${esc(m.food)} · ${m.qty} · ${m.cal} kcal · ${m.prot}g protein</span><button class="btn" onclick="deleteMeal(${x.meals.indexOf(m)})">×</button></div>`).join('')||'<span class="muted">Nothing logged.</span>'}</div>`).join('')}</div>
<div class="card" style="margin-top:14px"><div class="row"><div><div class="eyebrow">Habits</div><h3 style="margin:3px 0">Daily consistency · ${score}/8</h3></div><b>${Math.round(score/8*100)}%</b></div><div class="bar"><i style="width:${score/8*100}%"></i></div><div class="fields" style="margin-top:12px">${habit(selected,'cal','Hit calorie target')}${habit(selected,'protein','Hit protein target')}${habit(selected,'workout','Completed workout')}${habit(selected,'steps','8,000+ steps')}${habit(selected,'water','Enough water')}${habit(selected,'sleep','7+ hours sleep')}${habit(selected,'snack','No unnecessary snacking')}${habit(selected,'consistent','Stayed consistent')}</div></div>
<div class="card" style="margin-top:14px"><div class="eyebrow">Weekly reflection</div><div class="fields">${textarea('What went well?','good',x.reflection.good)}${textarea('What went wrong?','bad',x.reflection.bad)}${textarea('What will I improve?','next',x.reflection.next)}</div></div>`}
function input(label,k,type,v,fn){return `<div class="field"><label>${label}</label><input type="${type}" value="${esc(v)}" oninput="${fn}(${selected},'${k}',this.value)"></div>`}
function selectField(label,k,v,opts){return `<div class="field"><label>${label}</label><select onchange="saveField(${selected},'${k}',this.value)">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></div>`}
function textarea(label,k,v){return `<div class="field"><label>${label}</label><textarea oninput="d(${selected}).reflection.${k}=this.value;localStorage.setItem(KEY,JSON.stringify(state))">${esc(v)}</textarea></div>`}
function habit(n,k,label){return `<label class="mini"><input type="checkbox" ${d(n).habits[k]?'checked':''} onchange="d(${n}).habits.${k}=this.checked;save()"> ${label}</label>`}
function saveField(n,k,v){set(n,k,v);localStorage.setItem(KEY,JSON.stringify(state));render()}
function addExercise(){const name=prompt('Exercise name');if(!name)return;const sets=prompt('Sets','3')||3,reps=prompt('Reps','10')||10,weight=prompt('Weight (kg)','')||'';d(selected).exercises.push({name,sets,reps,weight});save()}
function addMeal(){const meal=prompt('Meal: Breakfast, Lunch, Snacks, or Dinner','Breakfast');if(!meal||!['Breakfast','Lunch','Snacks','Dinner'].includes(meal))return;const food=prompt('Food item');if(!food)return;const qty=prompt('Quantity','1 serving')||'';const cal=+prompt('Calories','0')||0,prot=+prompt('Protein (g)','0')||0,carbs=+prompt('Carbs (g)','0')||0,fat=+prompt('Fat (g)','0')||0;const x=d(selected);x.meals.push({meal,food,qty,cal,prot,carbs,fat});x.calories=x.meals.reduce((a,m)=>a+ +m.cal,0);x.protein=x.meals.reduce((a,m)=>a+ +m.prot,0);x.carbs=x.meals.reduce((a,m)=>a+ +m.carbs,0);x.fat=x.meals.reduce((a,m)=>a+ +m.fat,0);x.habits.cal=x.calories<=x.calorieTarget;x.habits.protein=x.protein>=x.proteinTarget;save()}
function deleteMeal(i){d(selected).meals.splice(i,1);const x=d(selected);x.calories=x.meals.reduce((a,m)=>a+ +m.cal,0);x.protein=x.meals.reduce((a,m)=>a+ +m.prot,0);x.carbs=x.meals.reduce((a,m)=>a+ +m.carbs,0);x.fat=x.meals.reduce((a,m)=>a+ +m.fat,0);save()}
function progressView(p){let avg='Not enough data',rate=0,eta='Not available';if(p.weights.length>=2){const vals=p.weights.slice(-8);rate=(vals[0]-vals[vals.length-1])/Math.max(1,vals.length-1);avg=rate.toFixed(2)+' kg/entry';if(rate>0){const days=Math.ceil((p.current-state.targetWeight)/rate);eta=new Date(Date.now()+days*86400000).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}}return `<div class="three"><div class="card"><div class="eyebrow">Lowest</div><div class="big">${p.weights.length?Math.min(...p.weights).toFixed(1):'--'} kg</div></div><div class="card"><div class="eyebrow">Average recent change</div><div class="big">${avg}</div></div><div class="card"><div class="eyebrow">Projected target</div><div class="big" style="font-size:22px">${eta}</div><div class="muted">Projection uses recent entered weights only.</div></div></div><div class="card" style="margin-top:14px"><h3>Weight trajectory</h3><canvas id="weightChart" class="chart"></canvas></div><div class="card" style="margin-top:14px"><h3>Milestones</h3><div class="fields">${[95,90,85,80].map(w=>{const hit=p.current<=w;return `<div class="mini"><b>${hit?'✓':'○'} ${w} kg</b><div class="muted">${hit?'Reached':'Next target'}</div></div>`}).join('')}</div></div>`}
function calendar(){return `<div class="card"><div class="row"><div><div class="eyebrow">100-day calendar</div><h2 style="margin:3px 0">Every day counts</h2></div><span class="muted">🟢 strong · 🟡 partial · 🔴 missed · ⚪ empty</span></div><div class="calendar" style="margin-top:16px">${Array.from({length:100},(_,i)=>{const n=i+1,s=dayScore(d(n));return `<button class="day ${s>=6?'good':s>=3?'partial':s?'bad':''} ${n===selected?'selected':''}" onclick="selected=${n};tab('journal');render()"><small>${n}</small></button>`}).join('')}</div></div><div class="card" style="margin-top:14px"><h3>Milestone days</h3><div class="fields">${[1,10,25,50,75,100].map(n=>`<div class="mini"><b>Day ${n}</b><div class="muted">${n<=selected?'Unlocked':'Locked'}</div></div>`).join('')}</div></div>`}
function analytics(){return `<div class="three"><div class="card"><div class="eyebrow">Window</div><select onchange="drawAnalytics(+this.value)" id="window"><option value="7">7 days</option><option value="30">30 days</option><option value="100" selected>100 days</option></select></div><div class="card"><div class="eyebrow">Workout days</div><div class="big">${Object.values(state.days).filter(x=>x.workout).length}</div></div><div class="card"><div class="eyebrow">Average consistency</div><div class="big">${Math.round(Object.values(state.days).reduce((a,x)=>a+dayScore(x),0)/Math.max(1,Object.keys(state.days).length)/8*100)}%</div></div></div><div class="card" style="margin-top:14px"><h3>Trends</h3><canvas id="analyticsChart" class="chart"></canvas></div>`}
function drawLine(canvas,series,labels,opts={}){const c=canvas.getContext('2d'),w=canvas.width=canvas.clientWidth*2,h=canvas.height=canvas.clientHeight*2;c.scale(2,2);const W=canvas.clientWidth,H=canvas.clientHeight;c.clearRect(0,0,W,H);const vals=series.filter(v=>v!=null),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');for(let i=0;i<5;i++){const y=15+i*(H-35)/4;c.beginPath();c.moveTo(35,y);c.lineTo(W-10,y);c.stroke()}c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--text');c.lineWidth=2;c.beginPath();series.forEach((v,i)=>{if(v==null)return;const x=35+i*(W-50)/Math.max(1,series.length-1),y=15+(max-v)/range*(H-35);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');c.font='11px system-ui';c.fillText(opts.title||'',35,12);if(vals.length){c.fillText(max.toFixed(1),3,20);c.fillText(min.toFixed(1),3,H-18)}}
function drawWeight(){const c=document.getElementById('weightChart');if(!c)return;const s=Array.from({length:selected},(_,i)=>d(i+1).weight?+d(i+1).weight:null);drawLine(c,s,[],{title:'Weight (kg)'});}
function drawAnalytics(days=100){const c=document.getElementById('analyticsChart');if(!c)return;const s=Array.from({length:Math.min(days,100)},(_,i)=>dayScore(d(100-Math.min(days,100)+i+1)));drawLine(c,s,[],{title:'Habit completion score / 8'});}
function tab(id,btn){document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));if(btn)btn.classList.add('active');else document.querySelector(`.tab[onclick*="${id}"]`)?.classList.add('active');setTimeout(()=>{drawWeight();drawAnalytics()},20)}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';save()}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='100-day-fitness-backup.json';a.click()}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save()}catch{alert('Invalid backup file.')}};r.readAsText(f)}
function exportCSV(){let rows=[['Day','Weight','Waist','Body Fat','Sleep','Water','Steps','Calories Target','Calories','Protein Target','Protein','Carbs','Fat','Workout','Type','Duration','Burned','Habit Score']];for(let i=1;i<=100;i++){const x=d(i);rows.push([i,x.weight,x.waist,x.bodyfat,x.sleep,x.water,x.steps,x.calorieTarget,x.calories,x.proteinTarget,x.protein,x.carbs,x.fat,x.workout,x.workoutType,x.duration,x.burned,dayScore(x)])}const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='100-day-fitness.csv';a.click()}
render();
</script>
</body></html>
